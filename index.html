<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoftRain7</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #111;
      color: #eee;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .box {
      max-width: 400px;
    }

    .avatar {
      width: 90px;
      height: 90px;
      background: #6c5ce7;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: bold;
      margin: 0 auto 20px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .tagline {
      color: #aaa;
      margin-bottom: 40px;
    }

    .section-title {
      color: #a29bfe;
      font-size: 0.8rem;
      letter-spacing: 2px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .about {
      color: #ccc;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .angry {
      color: #ff6b6b;
      font-size: 1.6rem;
      font-weight: bold;
      margin: 25px 0;
      cursor: pointer;
      user-select: none;
    }

    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: #2d2d44;
      color: #a29bfe;
      text-decoration: none;
      border-radius: 10px;
      margin-top: 10px;
    }

    footer {
      margin-top: 50px;
      color: #666;
      font-size: 0.9rem;
    }

    /* Чёрный экран */
    #screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }

    #screen.show {
      display: flex;
    }

    #screen span {
      color: #ff0000;
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: 6px;
      animation: shake 0.5s infinite;
    }

    @keyframes shake {
      0% { transform: translate(0, 0) rotate(0deg); }
      10% { transform: translate(-6px, -3px) rotate(-2deg); }
      20% { transform: translate(6px, 2px) rotate(2deg); }
      30% { transform: translate(-5px, 4px) rotate(-1deg); }
      40% { transform: translate(5px, -2px) rotate(1deg); }
      50% { transform: translate(-4px, 3px) rotate(-2deg); }
      60% { transform: translate(4px, -4px) rotate(2deg); }
      70% { transform: translate(-3px, 2px) rotate(-1deg); }
      80% { transform: translate(3px, -1px) rotate(1deg); }
      90% { transform: translate(-2px, 3px) rotate(0deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
  </style>
</head>
<body>

  <div class="box">
    <div class="avatar">S</div>
    <h1>SoftRain7</h1>
    <p class="tagline">Привет, я только начинаю свой путь в вебе</p>

    <div class="section-title">О себе</div>
    <p class="about">
      Здесь можно написать пару предложений о себе.<br>
      Чем увлекаешься, чем занимаешься или что хочешь рассказать миру.
    </p>

    <div class="angry" onclick="openScreen()">Мать злая</div>

    <div class="section-title">Ссылки</div>
    <a href="https://github.com/SoftRain7" class="btn">GitHub</a>

    <footer>Сделано с ❤️ · 2026</footer>
  </div>

  <div id="screen" onclick="closeScreen()">
    <span>ОЧЕНЬ</span>
  </div>

  <script>
    function openScreen() {
      document.getElementById('screen').classList.add('show');
    }
    function closeScreen() {
      document.getElementById('screen').classList.remove('show');
    }
  </script>

</body>
</html>
