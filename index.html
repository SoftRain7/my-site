<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мать злая</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #111;
      color: #eee;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }

    .angry {
      color: #ff6b6b;
      font-size: 2.2rem;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    /* Чёрный экран */
    #screen {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }

    #screen.show {
      display: flex;
    }

    #screen span {
      color: #ff0000;
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: 6px;
      animation: shake 0.5s infinite;
    }

    @keyframes shake {
      0% { transform: translate(0, 0) rotate(0deg); }
      10% { transform: translate(-6px, -3px) rotate(-2deg); }
      20% { transform: translate(6px, 2px) rotate(2deg); }
      30% { transform: translate(-5px, 4px) rotate(-1deg); }
      40% { transform: translate(5px, -2px) rotate(1deg); }
      50% { transform: translate(-4px, 3px) rotate(-2deg); }
      60% { transform: translate(4px, -4px) rotate(2deg); }
      70% { transform: translate(-3px, 2px) rotate(-1deg); }
      80% { transform: translate(3px, -1px) rotate(1deg); }
      90% { transform: translate(-2px, 3px) rotate(0deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
  </style>
</head>
<body>

  <div class="angry" onclick="openScreen()">Мать злая</div>

  <div id="screen" onclick="closeScreen()">
    <span>ОЧЕНЬ</span>
  </div>

  <script>
    function openScreen() {
      document.getElementById('screen').classList.add('show');
    }
    function closeScreen() {
      document.getElementById('screen').classList.remove('show');
    }
  </script>

</body>
</html>
